# WxPayMonitor hot configuration (UTF-8)
enabled=true

# 平台地址（必填，不要以 / 结尾）
# 示例：https://pay.example.com
platform_address=

# 平台监控上报接口
report_api_path=/api/report/app

# 商户 ID / 回调标识（必填，按平台后台提供的信息填写）
merchant_id=

# 商户密钥 / 回调 Token（必填）
merchant_key=

# 通讯密钥（平台当前抓包协议 sign 为空；留作以后启用签名）
# 通讯密钥（当前兼容协议 sign 为空；为未来签名模式预留）
communication_key=
sign_mode=empty

# 监控/失败重试/配置重载周期，单位秒
monitor_period_seconds=10

# 已安装 curl 模块时通常就是此路径；不存在则自动从 PATH 查找
curl_path=/system/bin/curl

# 仅监听微信，并仅上报收款类通知，避免转发普通聊天隐私
packages=com.tencent.mm
title_keywords=微信收款助手
message_keywords=收款到账
